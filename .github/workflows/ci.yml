name: CI

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
        with:
          version: 10.11.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install

      - name: "🔎 Lint code"
        run: pnpm run lint

      # The build log is captured so the verification step can detect Astro's
      # "does not exist or is empty" collection warning, which does NOT fail
      # the build on its own. tee keeps the log visible in the CI output.
      - name: "🚀 Build the project"
        run: set -o pipefail && pnpm run build 2>&1 | tee /tmp/build.log

      # A zero exit status from Astro does not mean the site has content: an
      # unresolvable content collection is a warning, so a build that emits
      # no posts still "succeeds" and Netlify publishes it. See issue #48.
      - name: "✅ Verify build output"
        run: ./scripts/verify-build-output.sh /tmp/build.log
