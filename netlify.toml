[build]
  # The diagnostic prints the error `astro check` hides when the restored
  # dependency cache is broken. It always exits 0. Remove it once fixed.
  command = "node scripts/diagnose-check-deps.mjs && pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

# Redirects from old ameliabooneracing.com URL structure
[[redirects]]
  from = "/raceschedule.html"
  to = "/race-schedule"
  status = 301

[[redirects]]
  from = "/news.html"
  to = "/press"
  status = 301

[[redirects]]
  from = "/aboutme.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/support.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/blog/"
  to = "/posts"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/posts"
  status = 301

[[redirects]]
  from = "/blog/:category/:slug"
  to = "/posts/:slug"
  status = 301
