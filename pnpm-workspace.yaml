# pnpm settings live here, not in package.json's `pnpm` field.
#
# pnpm 11 stopped reading `pnpm.*` from package.json and ignores those keys
# silently — it does not fail, it just drops them. Dependabot regenerates
# lockfiles with pnpm 11, so the sharp override below was omitted from every
# generated lockfile while CI (pinned to pnpm 10) still expected it. That
# surfaced as ERR_PNPM_LOCKFILE_CONFIG_MISMATCH on every dependabot PR, and
# more seriously it un-applied the pin: astro resolved sharp 0.34.5 again.
# This file is read by both pnpm 10 and 11, so the two agree.
# See smartwatermelon/dotfiles style note and https://pnpm.io/settings.

# sharp needed an override here (GHSA-f88m-g3jw-g9cj) while astro 5 pinned
# `sharp ^0.34.0`. astro 7 declares `sharp ^0.35.4` itself, so the override
# was removed in the astro 7 upgrade.
#
# Force fflate >=0.7.5 to clear GHSA-px8p-9vwx-vf98 (unzipSync infinite loop on
# malformed ZIP64 archives). Load-bearing for the same structural reason the
# sharp override was: satori 0.35.0 — the latest release — declares
# `fflate: 0.7.3` as an EXACT pin, not a range, so `pnpm update` cannot move
# it and there is no
# satori version to upgrade to. An override is the only mechanism that reaches
# it. 0.7.3 -> 0.7.5 is a patch bump within the same minor.
overrides:
  fflate: ^0.7.5

# esbuild and sharp need their install scripts to run; pnpm blocks build
# scripts by default.
onlyBuiltDependencies:
  - esbuild
  - sharp
